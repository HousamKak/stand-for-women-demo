name: Deploy demo to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the demo
        uses: actions/checkout@v6

      - name: Validate the prepared website
        shell: bash
        run: |
          test -s docs/index.html
          test -s docs/app.js
          test -s docs/style.css
          test -s docs/content.json
          test -s docs/assets/inter.woff2
          test -s docs/assets/cardo.woff2
          test -f docs/.nojekyll
          node --check docs/app.js
          node -e "const fs=require('fs');const d=JSON.parse(fs.readFileSync('docs/content.json','utf8'));if(!d.projects.length||!d.partners.length)throw new Error('Missing demo content');console.log(d.projects.length+' projects; '+d.partners.length+' partners');"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload the website
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
